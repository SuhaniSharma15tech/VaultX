services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultx
      POSTGRES_PASSWORD: vaultx_dev_password
      POSTGRES_DB: vaultx
    ports:
      - "5432:5432"
    volumes:
      - vaultx_pgdata:/var/lib/postgresql/data

volumes:
  vaultx_pgdata:
